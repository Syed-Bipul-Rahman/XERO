name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM/clang
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18
      - name: Build
        run: cargo build --release
      - name: Test
        env:
          XERO_CLANG: clang-18
        run: cargo test --release
