name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 ships clang 14 as `clang`: xeroc must pick a newer versioned one
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (Linux)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          echo "XERO_CLANG=clang-18" >> "$GITHUB_ENV"
      - name: Show clang
        run: clang --version
        shell: bash
        continue-on-error: true
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Test with the C library (Linux)
        if: runner.os == 'Linux'
        run: XERO_TEST_FLAGS=--libc cargo test --release --test harness
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/xeroc run examples/hello.xr
          ./target/release/xeroc run examples/tour.xr

  cross:
    # Linux programs need no C library, so they cross-compile with lld alone;
    # run every test program for each target under qemu.
    name: cross (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, riscv64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 qemu-user
          echo "XERO_CLANG=clang-18" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release
      - name: Test under qemu
        run: |
          XERO_TEST_FLAGS="--target ${{ matrix.target }}-linux" \
          XERO_TEST_RUNNER="qemu-${{ matrix.target }}" \
          cargo test --release --test harness run_programs

  installers:
    # Builds a release-style archive and installs it with the real install scripts.
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) p=linux-x86_64 ;;
            Linux-aarch64) p=linux-aarch64 ;;
            Darwin-arm64) p=macos-arm64 ;;
            Darwin-x86_64) p=macos-x86_64 ;;
          esac
          mkdir "xeroc-$p"
          cp target/release/xeroc README.md INSTALL.md "xeroc-$p/"
          cp -r docs examples "xeroc-$p/"
          tar czf "$RUNNER_TEMP/xeroc.tar.gz" "xeroc-$p"
      - name: Install system-wide with sudo (Unix)
        if: runner.os != 'Windows'
        run: |
          sudo XERO_ARCHIVE="$RUNNER_TEMP/xeroc.tar.gz" bash install/install.sh
          /usr/local/bin/xeroc run /usr/local/share/xero/examples/hello.xr
      - name: Install per-user without sudo, then uninstall (Unix)
        if: runner.os != 'Windows'
        run: |
          XERO_ARCHIVE="$RUNNER_TEMP/xeroc.tar.gz" bash install/install.sh --no-deps
          "$HOME/.xero/bin/xeroc" run "$HOME/.xero/share/xero/examples/tour.xr"
          bash install/install.sh --uninstall
          test ! -e "$HOME/.xero/bin/xeroc"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory xeroc-windows-x86_64 | Out-Null
          Copy-Item target/release/xeroc.exe, README.md, INSTALL.md xeroc-windows-x86_64/
          Copy-Item -Recurse docs, examples xeroc-windows-x86_64/
          Compress-Archive xeroc-windows-x86_64 "$env:RUNNER_TEMP/xeroc.zip"
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:XERO_ARCHIVE = "$env:RUNNER_TEMP/xeroc.zip"
          Get-Content -Raw install/install.ps1 | Invoke-Expression
          xeroc run "$env:LOCALAPPDATA\Programs\Xero\examples\hello.xr"

  ci-passed:
    # Single required status check for branch protection: every PR into
    # `main` must pass the tests on all platforms and the installer checks.
    name: CI passed
    if: always()
    needs: [test, cross, installers]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.cross.result }}" != "success" ] || [ "${{ needs.installers.result }}" != "success" ]; then
            echo "test: ${{ needs.test.result }}, cross: ${{ needs.cross.result }}, installers: ${{ needs.installers.result }}"
            exit 1
          fi
