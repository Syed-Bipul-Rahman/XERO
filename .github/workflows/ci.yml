name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 ships clang 14 as `clang`: xeroc must pick a newer versioned one
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (Linux)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          echo "XERO_CLANG=clang-18" >> "$GITHUB_ENV"
      - name: Show clang
        run: clang --version
        shell: bash
        continue-on-error: true
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Test with the C library (Linux)
        if: runner.os == 'Linux'
        run: XERO_TEST_FLAGS=--libc cargo test --release --test harness
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/xeroc run examples/hello.xr
          ./target/release/xeroc run examples/tour.xr

  cross:
    # Linux programs need no C library, so they cross-compile with lld alone;
    # run every test program for each target under qemu.
    name: cross (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, riscv64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 qemu-user
          echo "XERO_CLANG=clang-18" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release
      - name: Test under qemu
        run: |
          XERO_TEST_FLAGS="--target ${{ matrix.target }}-linux" \
          XERO_TEST_RUNNER="qemu-${{ matrix.target }}" \
          cargo test --release --test harness run_programs

  builtin-llvm:
    # xeroc with LLVM and lld linked in (`--features llvm`): every test must
    # pass with no clang installed.
    name: built-in LLVM (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM libraries and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev liblld-18-dev libpolly-18-dev qemu-user
          echo "XERO_LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --features llvm
      - name: Hide clang
        run: |
          mkdir -p "$RUNNER_TEMP/noclang"
          for c in clang $(seq -f 'clang-%g' 14 24); do printf '#!/bin/sh\nexit 127\n' > "$RUNNER_TEMP/noclang/$c"; chmod +x "$RUNNER_TEMP/noclang/$c"; done
          echo "$RUNNER_TEMP/noclang" >> "$GITHUB_PATH"
      - name: Test without clang
        run: cargo test --release --features llvm
      - name: Test ARM64 and RISC-V without clang
        run: |
          for t in aarch64 riscv64; do
            XERO_TEST_FLAGS="--target $t-linux" XERO_TEST_RUNNER="qemu-$t" cargo test --release --features llvm --test harness run_programs
          done

  static-llvm-linux:
    # The release build for Linux: a static musl binary with LLVM inside,
    # built on Alpine (whose LLVM and lld are musl static libraries).
    name: static built-in LLVM (alpine, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            set -e
            apk add --no-cache bash git build-base cmake ninja python3 curl xz rust cargo llvm18-dev llvm18-static zlib-static zstd-static libxml2-dev libxml2-static xz-static ncurses-static linux-headers > /tmp/apk.log 2>&1 || { tail -5 /tmp/apk.log; exit 1; }
            # static lld libraries matching LLVM 18 (Alpine ships lld 19 as shared libraries)
            V=18.1.8
            mkdir -p /tmp/llvm-src && cd /tmp/llvm-src
            for p in lld libunwind cmake; do
              curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$V/$p-$V.src.tar.xz" | tar xJ
              mv "$p-$V.src" "$p"
            done
            mkdir -p llvm
            # the LLVM CMake exports of Alpine name a few libraries it does not ship
            for f in $(grep -ohE "lib/lib[A-Za-z0-9_]+\.a" /usr/lib/llvm18/lib/cmake/llvm/LLVMExports*.cmake | sort -u); do
              [ -e "/usr/lib/llvm18/$f" ] || ar rc "/usr/lib/llvm18/$f"
            done
            cmake -G Ninja -S lld -B lld-build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=/usr/lib/llvm18/lib/cmake/llvm -DLLVM_MAIN_SRC_DIR=/tmp/llvm-src/llvm -DLLVM_INCLUDE_TESTS=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/opt/lld > /tmp/lld-cmake.log 2>&1 || { echo "::error title=lld cmake::$(tail -30 /tmp/lld-cmake.log | tr "\n" "|")"; exit 1; }
            ninja -C lld-build lldCOFF lldELF lldMachO lldWasm lldCommon > /tmp/lld-build.log 2>&1 || { echo "::error title=lld build::$(grep -E "error" /tmp/lld-build.log | head -20 | tr "\n" "|")"; exit 1; }
            cp lld-build/lib/liblld*.a /usr/lib/llvm18/lib/
            mkdir -p /usr/lib/llvm18/include/lld && cp -r lld/include/lld/Common /usr/lib/llvm18/include/lld/
            cd /src
            echo "::warning title=alpine lld::built $(ls /usr/lib/llvm18/lib/liblld*.a | tr "\n" " ")"
            export XERO_LLVM_CONFIG=/usr/lib/llvm18/bin/llvm-config
            export RUSTFLAGS="-C target-feature=+crt-static"
            export XERO_LLVM_EXTRA_LIBS="lzma gcc"
            if ! cargo build --release --features llvm > /tmp/build.log 2>&1; then
              echo "::error title=alpine build::$(grep -E "error|undefined|cannot find" /tmp/build.log | sort -u | head -30 | tr "\n" "|")"
              exit 1
            fi
            echo "::warning title=alpine binary::$(ls -l target/release/xeroc) $(file target/release/xeroc 2>/dev/null)"
            ./target/release/xeroc run examples/hello.xr
            ./target/release/xeroc run examples/concurrency.xr
            cargo test --release --features llvm > /tmp/test.log 2>&1 || { echo "::error title=alpine test::$(tail -40 /tmp/test.log | tr "\n" "|")"; exit 1; }
            tail -3 /tmp/test.log
          '

  prebuilt-llvm:
    # macOS and Windows release builds: LLVM's official prebuilt libraries.
    name: built-in LLVM (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            llvm: clang+llvm-18.1.8-arm64-apple-macos11
          - os: windows-2022
            llvm: clang+llvm-18.1.8-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download LLVM
        shell: bash
        run: |
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/${{ matrix.llvm }}.tar.xz" -o llvm.tar.xz
          mkdir -p "$RUNNER_TEMP/llvm" && tar -xJf llvm.tar.xz -C "$RUNNER_TEMP/llvm" --strip-components=1
          rm llvm.tar.xz
          ls "$RUNNER_TEMP/llvm/lib" | grep -iE "^(lib)?lld" | tr '\n' ' ' > lld.txt || true
          echo "::warning title=llvm package::lld: $(cat lld.txt) syslibs: $("$RUNNER_TEMP/llvm/bin/llvm-config" --system-libs --link-static 2>&1 | tr '\n' ' ')"
          echo "XERO_LLVM_CONFIG=$RUNNER_TEMP/llvm/bin/llvm-config" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --features llvm > build.log 2>&1 || { echo "::error title=build::$(grep -E "error|unresolved|undefined" build.log | sort -u | head -30 | tr '\n' '|')"; exit 1; }
          ls -l target/release/
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          # the runner's own LLVM must not be used
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -viE "llvm" | paste -sd: -)"
          ./target/release/xeroc run examples/hello.xr
          cargo test --release --features llvm > test.log 2>&1 || { echo "::error title=test::$(tail -40 test.log | tr '\n' '|')"; exit 1; }
          tail -5 test.log

  installers:
    # Builds a release-style archive and installs it with the real install scripts.
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) p=linux-x86_64 ;;
            Linux-aarch64) p=linux-aarch64 ;;
            Darwin-arm64) p=macos-arm64 ;;
            Darwin-x86_64) p=macos-x86_64 ;;
          esac
          mkdir "xeroc-$p"
          cp target/release/xeroc README.md INSTALL.md "xeroc-$p/"
          cp -r docs examples "xeroc-$p/"
          tar czf "$RUNNER_TEMP/xeroc.tar.gz" "xeroc-$p"
      - name: Install system-wide with sudo (Unix)
        if: runner.os != 'Windows'
        run: |
          sudo XERO_ARCHIVE="$RUNNER_TEMP/xeroc.tar.gz" bash install/install.sh
          /usr/local/bin/xeroc run /usr/local/share/xero/examples/hello.xr
      - name: Install per-user without sudo, then uninstall (Unix)
        if: runner.os != 'Windows'
        run: |
          XERO_ARCHIVE="$RUNNER_TEMP/xeroc.tar.gz" bash install/install.sh --no-deps
          "$HOME/.xero/bin/xeroc" run "$HOME/.xero/share/xero/examples/tour.xr"
          bash install/install.sh --uninstall
          test ! -e "$HOME/.xero/bin/xeroc"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory xeroc-windows-x86_64 | Out-Null
          Copy-Item target/release/xeroc.exe, README.md, INSTALL.md xeroc-windows-x86_64/
          Copy-Item -Recurse docs, examples xeroc-windows-x86_64/
          Compress-Archive xeroc-windows-x86_64 "$env:RUNNER_TEMP/xeroc.zip"
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:XERO_ARCHIVE = "$env:RUNNER_TEMP/xeroc.zip"
          Get-Content -Raw install/install.ps1 | Invoke-Expression
          xeroc run "$env:LOCALAPPDATA\Programs\Xero\examples\hello.xr"

  ci-passed:
    # Single required status check for branch protection: every PR into
    # `main` must pass the tests on all platforms and the installer checks.
    name: CI passed
    if: always()
    needs: [test, cross, installers]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.cross.result }}" != "success" ] || [ "${{ needs.installers.result }}" != "success" ]; then
            echo "test: ${{ needs.test.result }}, cross: ${{ needs.cross.result }}, installers: ${{ needs.installers.result }}"
            exit 1
          fi
