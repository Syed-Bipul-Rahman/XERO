name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 ships clang 14 as `clang`: xeroc must pick a newer versioned one
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (Linux)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          echo "XERO_CLANG=clang-18" >> "$GITHUB_ENV"
      - name: Show clang
        run: clang --version
        shell: bash
        continue-on-error: true
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Test with the C library (Linux)
        if: runner.os == 'Linux'
        run: XERO_TEST_FLAGS=--libc cargo test --release --test harness
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/xeroc run examples/hello.xr
          ./target/release/xeroc run examples/tour.xr

  cross:
    # Linux programs need no C library, so they cross-compile with lld alone;
    # run every test program for each target under qemu.
    name: cross (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, riscv64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 qemu-user
          echo "XERO_CLANG=clang-18" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release
      - name: Test under qemu
        run: |
          XERO_TEST_FLAGS="--target ${{ matrix.target }}-linux" \
          XERO_TEST_RUNNER="qemu-${{ matrix.target }}" \
          cargo test --release --test harness run_programs

  builtin-llvm:
    # xeroc with LLVM and lld linked in (`--features llvm`): every test must
    # pass with no clang installed.
    name: built-in LLVM (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM libraries and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev liblld-18-dev libpolly-18-dev qemu-user
          echo "XERO_LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --features llvm
      - name: Hide clang
        run: |
          mkdir -p "$RUNNER_TEMP/noclang"
          for c in clang $(seq -f 'clang-%g' 14 24); do printf '#!/bin/sh\nexit 127\n' > "$RUNNER_TEMP/noclang/$c"; chmod +x "$RUNNER_TEMP/noclang/$c"; done
          echo "$RUNNER_TEMP/noclang" >> "$GITHUB_PATH"
      - name: Test without clang
        run: cargo test --release --features llvm
      - name: Test ARM64 and RISC-V without clang
        run: |
          for t in aarch64 riscv64; do
            XERO_TEST_FLAGS="--target $t-linux" XERO_TEST_RUNNER="qemu-$t" cargo test --release --features llvm --test harness run_programs
          done

  static-llvm-linux:
    # The release build for Linux: a static musl binary with LLVM inside,
    # built on Alpine (whose LLVM and lld are musl static libraries).
    name: static built-in LLVM (alpine, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    container: alpine:3.21
    steps:
      - name: Install toolchain
        run: |
          apk add --no-cache bash git build-base rust cargo llvm18-dev llvm18-static lld-dev zlib-static zstd-static libxml2-static xz-static ncurses-static linux-headers
          apk info -L lld-dev | grep -E "\.a$" | head -20 || true
          ls /usr/lib/llvm18/lib/*.a | wc -l
          /usr/lib/llvm18/bin/llvm-config --system-libs --link-static
      - uses: actions/checkout@v4
      - name: Build (static)
        run: |
          export XERO_LLVM_CONFIG=/usr/lib/llvm18/bin/llvm-config
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --features llvm
          ls -l target/release/xeroc
          file target/release/xeroc || true
          ldd target/release/xeroc || true
      - name: Test
        run: |
          ./target/release/xeroc run examples/hello.xr
          ./target/release/xeroc run examples/concurrency.xr
          RUSTFLAGS="-C target-feature=+crt-static" cargo test --release --features llvm

  installers:
    # Builds a release-style archive and installs it with the real install scripts.
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) p=linux-x86_64 ;;
            Linux-aarch64) p=linux-aarch64 ;;
            Darwin-arm64) p=macos-arm64 ;;
            Darwin-x86_64) p=macos-x86_64 ;;
          esac
          mkdir "xeroc-$p"
          cp target/release/xeroc README.md INSTALL.md "xeroc-$p/"
          cp -r docs examples "xeroc-$p/"
          tar czf "$RUNNER_TEMP/xeroc.tar.gz" "xeroc-$p"
      - name: Install system-wide with sudo (Unix)
        if: runner.os != 'Windows'
        run: |
          sudo XERO_ARCHIVE="$RUNNER_TEMP/xeroc.tar.gz" bash install/install.sh
          /usr/local/bin/xeroc run /usr/local/share/xero/examples/hello.xr
      - name: Install per-user without sudo, then uninstall (Unix)
        if: runner.os != 'Windows'
        run: |
          XERO_ARCHIVE="$RUNNER_TEMP/xeroc.tar.gz" bash install/install.sh --no-deps
          "$HOME/.xero/bin/xeroc" run "$HOME/.xero/share/xero/examples/tour.xr"
          bash install/install.sh --uninstall
          test ! -e "$HOME/.xero/bin/xeroc"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory xeroc-windows-x86_64 | Out-Null
          Copy-Item target/release/xeroc.exe, README.md, INSTALL.md xeroc-windows-x86_64/
          Copy-Item -Recurse docs, examples xeroc-windows-x86_64/
          Compress-Archive xeroc-windows-x86_64 "$env:RUNNER_TEMP/xeroc.zip"
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:XERO_ARCHIVE = "$env:RUNNER_TEMP/xeroc.zip"
          Get-Content -Raw install/install.ps1 | Invoke-Expression
          xeroc run "$env:LOCALAPPDATA\Programs\Xero\examples\hello.xr"

  ci-passed:
    # Single required status check for branch protection: every PR into
    # `main` must pass the tests on all platforms and the installer checks.
    name: CI passed
    if: always()
    needs: [test, cross, installers]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.cross.result }}" != "success" ] || [ "${{ needs.installers.result }}" != "success" ]; then
            echo "test: ${{ needs.test.result }}, cross: ${{ needs.cross.result }}, installers: ${{ needs.installers.result }}"
            exit 1
          fi
