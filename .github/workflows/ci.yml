name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          echo "XERO_CLANG=clang-18" >> "$GITHUB_ENV"
      - name: Show clang
        run: clang --version
        shell: bash
        continue-on-error: true
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/xeroc run examples/hello.xr
          ./target/release/xeroc run examples/tour.xr
