name: Release

# Push a tag like `v0.1.0` to build xeroc for every platform and publish a
# GitHub release with the archives attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-22.04-arm
          - name: macos-arm64
            os: macos-14
          - name: macos-x86_64
            os: macos-13
          - name: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Package
        shell: bash
        run: |
          dir="xeroc-${{ matrix.name }}"
          mkdir -p "$dir"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/xeroc.exe "$dir/"
          else
            cp target/release/xeroc "$dir/"
          fi
          cp -r README.md INSTALL.md docs examples "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Xero $TAG" \
            --notes "Prebuilt \`xeroc\` compilers. See INSTALL.md in each archive: Xero needs clang (LLVM 17+) installed as its code-generation backend."
